name: Deploy to Fly.io
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  deploy:
    name: Deploy app
    runs-on: ubuntu-latest
    if: github.repository_owner == 'Hotel-Gran-Marquise'
    concurrency:
      group: deploy-${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm ci --omit=dev
      - name: Validate syntax (node --check)
        run: |
          node --check src/server.js
          node --check src/db.js
          node --check src/routes/feedback.js
          node --check src/routes/reservas.js
          node --check src/routes/cadastros.js
          node --check src/routes/auth.js
          node --check src/routes/dev.js
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --wait-timeout 180
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: Wait for health
        run: |
          echo "Aguardando app responder..."
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" https://pesquisa-satisfacao.fly.dev/api/health)
            if [ "$STATUS" = "200" ]; then
              echo "App no ar (tentativa $i)"
              exit 0
            fi
            echo "Tentativa $i — HTTP $STATUS, aguardando 5s..."
            sleep 5
          done
          echo "Timeout: app nao respondeu em 150s"
          exit 1
      - name: Notificar Hub de deploy
        if: success()
        env:
          HUB_WEBHOOK_SECRET: ${{ secrets.HUB_WEBHOOK_SECRET }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          FIRST=$(printf '%s' "$COMMIT_MSG" | head -1)
          if printf '%s' "$FIRST" | grep -qiE '^hotfix'; then TIPO=hotfix
          elif printf '%s' "$FIRST" | grep -qiE '^fix'; then TIPO=fix
          elif printf '%s' "$FIRST" | grep -qiE '^feat'; then TIPO=feat
          else TIPO=melhoria; fi
          TITULO=$(printf '%s' "$FIRST" | sed 's/^[a-zA-Z-]*([^)]*): *//' | sed 's/^[a-zA-Z-]*: *//' | cut -c1-120)
          curl -sf -X POST https://hub-granmarquise.fly.dev/api/webhook/update \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer $HUB_WEBHOOK_SECRET" \
            -d "$(jq -cn --arg tipo "$TIPO" --arg titulo "$TITULO" \
              '{sistemaId:"pesquisa",sistemaNome:"Pesquisa SPA",tipo:$tipo,titulo:$titulo}')" || true
